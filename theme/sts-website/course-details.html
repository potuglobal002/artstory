<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course details — STS Institute</title>
<meta name="description" content="Full syllabus, week-by-week plan, assessment, materials, fees and policies for STS Institute courses in Narsingdi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tw-config.js"></script>
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="https://sts.institute/riltoduw/2024/08/Logo-v2-01.png">
</head>
<body>
<div id="site-header" data-mode="solid" data-active="courses"></div>
<a id="main" tabindex="-1"></a>
<main id="page"></main>

<!-- Sticky enrol bar -->
<div class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-line shadow-[0_-6px_24px_rgba(25,35,53,.08)] lg:hidden" id="bar"></div>

<div id="site-footer"></div>
<script src="assets/site.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const slug = new URLSearchParams(location.search).get("c") || "ielts-academic";
  const c = COURSES.find(x => x.slug === slug) || COURSES[0];
  document.title = c.name + " — course details | STS Institute";

  /* Week plan built from the module list */
  const weeksTotal = c.duration.includes("1 month") ? 4 : c.duration.includes("6 weeks") ? 6 : c.duration.includes("6 months") ? 24 : 12;
  const per = Math.max(1, Math.round(weeksTotal / c.modules.length));
  const plan = c.modules.map((m, i) => ({
    span: i === c.modules.length - 1 ? `Week ${i * per + 1}–${weeksTotal}` : `Week ${i * per + 1}–${(i + 1) * per}`,
    t: m.t, d: m.d
  }));

  const sections = [
    ["overview", "Overview"], ["plan", "Week-by-week plan"], ["assessment", "Assessment"],
    ["materials", "Materials"], ["fees", "Fees & payment"], ["policies", "Policies"]
  ];

  document.getElementById("page").innerHTML = `
  <section class="bg-ink text-white pt-16 pb-16 md:pt-20 md:pb-20 relative overflow-hidden">
    <div class="grid-drift opacity-[.14]"></div>
    <div class="shell relative">
      <nav class="text-[13px] text-white/50 flex items-center gap-2 flex-wrap">
        <a href="index.html" class="hover:text-white">Home</a><span>/</span>
        <a href="courses.html" class="hover:text-white">Courses</a><span>/</span>
        <a href="course.html?c=${c.slug}" class="hover:text-white">${c.name}</a><span>/</span>
        <span class="text-white/80">Details</span>
      </nav>
      <h1 class="mt-6 text-white text-[clamp(30px,4.8vw,50px)] max-w-3xl">${c.name} — full course details</h1>
      <div class="mt-7 flex flex-wrap gap-x-8 gap-y-4">
        ${[["Duration", c.duration], ["Classes", c.sessions], ["Batch size", c.batch], ["Target", c.band === "—" ? "All levels" : c.band], ["Fee", "৳ " + c.fee]]
          .map(([k, v]) => `<div><div class="mono text-[10px] tracking-[.16em] uppercase text-white/45">${k}</div><div class="font-display text-[19px] text-white mt-1.5">${v}</div></div>`).join("")}
      </div>
    </div>
  </section>

  <div class="shell py-14 md:py-20 grid gap-12 lg:grid-cols-[210px_1fr_280px] lg:gap-14 items-start">

    <!-- Contents -->
    <nav class="hidden lg:block sticky top-24">
      <p class="mono text-[10px] tracking-[.18em] uppercase text-muted mb-4">On this page</p>
      <ul class="grid gap-1 text-[14.5px]">
        ${sections.map(([id, label]) => `<li><a href="#${id}" class="block py-1.5 text-muted hover:text-flame-deep transition-colors">${label}</a></li>`).join("")}
      </ul>
    </nav>

    <!-- Body -->
    <article class="min-w-0 grid gap-14">
      <section id="overview">
        <h2 class="text-[27px]">Overview</h2>
        <p class="mt-4 text-[16.5px] leading-relaxed text-[#2c3a52]">${c.lead}</p>
        <p class="mt-4 text-[16.5px] leading-relaxed text-[#2c3a52]">${c.who}</p>
        <div class="mt-7 grid sm:grid-cols-2 gap-3">
          ${c.outcomes.map(o => `<div class="rounded-xl border border-line bg-mist p-4 text-[14.5px] text-[#2c3a52] leading-relaxed">${o}</div>`).join("")}
        </div>
      </section>

      <section id="plan">
        <h2 class="text-[27px]">Week-by-week plan</h2>
        <p class="mt-3 text-[15.5px] text-muted leading-relaxed">Indicative. Instructors adjust the pace to the batch, but the order does not change — skills are built in this sequence for a reason.</p>
        <div class="mt-7 grid gap-3">
          ${plan.map((p, i) => `
            <div class="rounded-xl border border-line bg-white p-5 flex flex-col sm:flex-row gap-4 sm:gap-6">
              <div class="sm:w-[130px] shrink-0">
                <span class="mono text-[12px] tracking-[.1em] text-flame">${p.span}</span>
              </div>
              <div>
                <h3 class="text-[17px]">${p.t}</h3>
                <p class="mt-1.5 text-[14.5px] text-muted leading-relaxed">${p.d}</p>
              </div>
            </div>`).join("")}
        </div>
      </section>

      <section id="assessment">
        <h2 class="text-[27px]">Assessment</h2>
        <p class="mt-3 text-[15.5px] text-muted leading-relaxed">You are measured continuously, so nothing about your final mock comes as a surprise.</p>
        <div class="mt-6 overflow-x-auto rounded-xl border border-line">
          <table class="w-full text-[14.5px] min-w-[520px]">
            <thead><tr class="bg-mist text-left"><th class="p-4 font-semibold">When</th><th class="p-4 font-semibold">What</th><th class="p-4 font-semibold">You receive</th></tr></thead>
            <tbody>
              <tr class="border-t border-line"><td class="p-4 text-muted">Before admission</td><td class="p-4">Placement assessment</td><td class="p-4 text-muted">Level and course recommendation</td></tr>
              <tr class="border-t border-line"><td class="p-4 text-muted">Weekly</td><td class="p-4">Skill tasks and speaking recordings</td><td class="p-4 text-muted">In-class feedback</td></tr>
              <tr class="border-t border-line"><td class="p-4 text-muted">Monthly</td><td class="p-4">Progress test</td><td class="p-4 text-muted">Score sheet with error patterns</td></tr>
              <tr class="border-t border-line"><td class="p-4 text-muted">Course end</td><td class="p-4">Full mock under exam conditions</td><td class="p-4 text-muted">Band estimate per skill + review session</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section id="materials">
        <h2 class="text-[27px]">Materials</h2>
        <ul class="mt-5 grid gap-3">
          ${c.includes.map(i => `<li class="flex gap-3.5 items-start">
            <span class="mt-1.5 w-1.5 h-1.5 rounded-full bg-flame shrink-0"></span>
            <span class="text-[15.5px] text-[#2c3a52] leading-relaxed">${i}</span></li>`).join("")}
        </ul>
        <p class="mt-5 text-[14.5px] text-muted leading-relaxed">Bring a notebook and a pen you are comfortable writing at speed with. For computer-delivered preparation, laptops are provided in the lab.</p>
      </section>

      <section id="fees">
        <h2 class="text-[27px]">Fees &amp; payment</h2>
        <div class="mt-6 rounded-xl border border-line overflow-hidden">
          <div class="flex items-center justify-between p-5 bg-ember">
            <div><div class="font-semibold">Course fee</div><div class="text-[13.5px] text-muted mt-0.5">${c.feeNote}</div></div>
            <div class="font-display text-[26px] text-flame-deep">৳ ${c.fee}</div>
          </div>
          <div class="flex items-center justify-between p-5 border-t border-line"><span>Admission &amp; registration</span><span class="font-medium">৳ 500 (one time)</span></div>
          <div class="flex items-center justify-between p-5 border-t border-line"><span>Extra mock test (optional)</span><span class="font-medium">৳ 500 each</span></div>
          <div class="flex items-center justify-between p-5 border-t border-line"><span>Sibling / repeat student discount</span><span class="font-medium">10%</span></div>
        </div>
        <p class="mt-4 text-[14.5px] text-muted leading-relaxed">
          Payable at the campus counter or by bKash / Nagad to the institute number confirmed at admission.
          Instalments are available on courses of three months or more — half at admission, half before the second month.
          The IELTS or PTE exam fee is set by IDP and Pearson and is paid separately at registration.
        </p>
      </section>

      <section id="policies">
        <h2 class="text-[27px]">Policies</h2>
        <div class="mt-5 grid gap-3">
          <details class="acc rounded-xl border border-line bg-white p-5">
            <summary class="flex items-center justify-between gap-5 text-[16px] font-semibold">Attendance <svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3.5 6l4.5 4.5L12.5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></summary>
            <p class="mt-3 text-[15px] text-muted leading-relaxed">A minimum of 80% attendance is expected. Below that, we cannot issue a completion certificate or guarantee mock scheduling. Attendance is recorded by QR check-in at the campus entrance.</p>
          </details>
          <details class="acc rounded-xl border border-line bg-white p-5">
            <summary class="flex items-center justify-between gap-5 text-[16px] font-semibold">Missed classes <svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3.5 6l4.5 4.5L12.5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></summary>
            <p class="mt-3 text-[15px] text-muted leading-relaxed">Class notes are shared with your batch group. You may sit the same topic in another running batch once per module, subject to seats.</p>
          </details>
          <details class="acc rounded-xl border border-line bg-white p-5">
            <summary class="flex items-center justify-between gap-5 text-[16px] font-semibold">Transfers and refunds <svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3.5 6l4.5 4.5L12.5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></summary>
            <p class="mt-3 text-[15px] text-muted leading-relaxed">You may transfer to another batch or defer once, free of charge, before the second month begins. If the placement assessment moves you to a lower course, your paid fee is credited in full.</p>
          </details>
          <details class="acc rounded-xl border border-line bg-white p-5">
            <summary class="flex items-center justify-between gap-5 text-[16px] font-semibold">Exam registration <svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3.5 6l4.5 4.5L12.5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></summary>
            <p class="mt-3 text-[15px] text-muted leading-relaxed">Registration is handled by our front desk. Bring the passport or NID you intend to sit the test with — the document on your registration must match the one you carry on test day, exactly.</p>
          </details>
        </div>
      </section>
    </article>

    <!-- Sidebar -->
    <aside class="hidden lg:block sticky top-24">
      <div class="rounded-2xl border border-line bg-white p-6 shadow-[var(--e2)]">
        <div class="font-display text-[30px] leading-none">৳ ${c.fee}</div>
        <p class="text-[13px] text-muted mt-1.5">${c.feeNote}</p>
        <div class="mt-5 grid gap-2.5">
          <a href="admission.html?course=${c.slug}" class="btn btn-primary w-full">Enrol now</a>
          <a href="course.html?c=${c.slug}" class="btn btn-ghost w-full btn-sm">Back to course</a>
        </div>
        <div class="mt-5 pt-5 border-t border-line grid gap-2 text-[13.5px] text-muted">
          <p>Next batch starts at the beginning of the month.</p>
          <p>Seats capped at ${c.batch}.</p>
        </div>
      </div>
      <div class="mt-4 rounded-2xl bg-ink text-white p-6">
        <p class="mono text-[10px] tracking-[.16em] uppercase text-white/50">Need advice first</p>
        <p class="mt-2.5 text-[15px] leading-relaxed text-white/80">Call the IELTS Department and ask for a level check.</p>
        <a href="tel:+8801901402204" class="btn btn-glass btn-sm mt-4 w-full">01901-402204</a>
      </div>
    </aside>
  </div>`;

  document.getElementById("bar").innerHTML = `
    <div class="shell py-3 flex items-center justify-between gap-4">
      <div><div class="font-display text-[20px] leading-none">৳ ${c.fee}</div><div class="text-[12px] text-muted mt-1">${c.name}</div></div>
      <a href="admission.html?course=${c.slug}" class="btn btn-primary btn-sm">Enrol now</a>
    </div>`;
  document.body.style.paddingBottom = window.innerWidth < 1024 ? "72px" : "0";

  initRails(); initReveal();
});
</script>
</body>
</html>
