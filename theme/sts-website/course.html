<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course — STS Institute</title>
<meta name="description" content="Course details at STS Institute, Narsingdi — schedule, fees, modules, outcomes and enrolment.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tw-config.js"></script>
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="https://sts.institute/riltoduw/2024/08/Logo-v2-01.png">
</head>
<body>
<div id="site-header" data-mode="solid" data-active="courses"></div>
<a id="main" tabindex="-1"></a>
<main id="page"></main>
<div id="site-footer"></div>

<script src="assets/site.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const slug = new URLSearchParams(location.search).get("c") || "ielts-academic";
  const c = COURSES.find(x => x.slug === slug) || COURSES[0];
  document.title = c.name + " — STS Institute";

  const related = COURSES.filter(x => x.slug !== c.slug && x.family === c.family).slice(0, 3);
  const more = related.length ? related : COURSES.filter(x => x.slug !== c.slug).slice(0, 3);

  document.getElementById("page").innerHTML = `
  <!-- Hero -->
  <section class="bg-ink text-white pt-16 pb-20 md:pt-20 md:pb-24 relative overflow-hidden">
    <div class="grid-drift opacity-[.14]"></div>
    <div class="shell relative grid gap-12 lg:grid-cols-[1.35fr_1fr] lg:gap-16 items-start">
      <div>
        <nav class="text-[13px] text-white/50 flex items-center gap-2 flex-wrap">
          <a href="index.html" class="hover:text-white">Home</a><span>/</span>
          <a href="courses.html" class="hover:text-white">Courses</a><span>/</span>
          <span class="text-white/80">${c.name}</span>
        </nav>
        <div class="mt-6 flex flex-wrap items-center gap-3">
          <span class="mono text-[11px] tracking-[.16em] uppercase text-flame-soft">${c.family}</span>
          ${c.badge ? `<span class="mono text-[10px] tracking-[.14em] uppercase px-2 py-1 rounded-md bg-flame text-white">${c.badge}</span>` : ""}
        </div>
        <h1 class="mt-4 text-white text-[clamp(32px,5.2vw,54px)]">${c.name}</h1>
        <p class="mt-5 text-white/80 text-[17px] leading-relaxed max-w-xl">${c.lead}</p>
        <div class="mt-9 bandrail text-white/45" data-rail="19" data-hit="${c.band === "7.0+" ? 14 : c.band === "6.5+" ? 13 : c.band === "65+" ? 13 : 8}"></div>
      </div>

      <!-- Enrol card -->
      <aside class="rounded-2xl bg-white text-ink p-7 shadow-[0_18px_50px_rgba(0,0,0,.28)]">
        <div class="flex items-baseline justify-between">
          <div>
            <div class="font-display text-[38px] leading-none">৳ ${c.fee}</div>
            <p class="text-[13px] text-muted mt-1.5">${c.feeNote}</p>
          </div>
          ${bandChip(c)}
        </div>
        <dl class="mt-6 grid gap-3 text-[14.5px] border-t border-line pt-6">
          <div class="flex justify-between gap-4"><dt class="text-muted">Duration</dt><dd class="font-medium">${c.duration}</dd></div>
          <div class="flex justify-between gap-4"><dt class="text-muted">Classes</dt><dd class="font-medium">${c.sessions}</dd></div>
          <div class="flex justify-between gap-4"><dt class="text-muted">Batch size</dt><dd class="font-medium">${c.batch}</dd></div>
          <div class="flex justify-between gap-4"><dt class="text-muted">Campus</dt><dd class="font-medium">${c.family === "Junior" ? "STS Junior Institute" : "Narsingdi Sadar"}</dd></div>
        </dl>
        <div class="mt-6 grid gap-2.5">
          <a href="admission.html?course=${c.slug}" class="btn btn-primary w-full">Enrol in this course</a>
          <a href="course-details.html?c=${c.slug}" class="btn btn-ghost w-full">Full syllabus &amp; fees</a>
        </div>
        <p class="mt-4 text-[13px] text-muted text-center">Or call the PR desk on <a href="tel:+8801901402202" class="text-flame-deep font-medium">01901-402202</a></p>
      </aside>
    </div>
  </section>

  <!-- Who it's for -->
  <section class="section bg-white">
    <div class="shell grid gap-12 lg:grid-cols-[1fr_1.1fr] lg:gap-20">
      <div>
        <span class="eyebrow">Who this is for</span>
        <p class="mt-6 text-[19px] leading-relaxed text-ink font-medium">${c.who}</p>
        <p class="mt-5 text-[15.5px] text-muted leading-relaxed">${c.short}</p>
        <div class="mt-8 rounded-xl bg-mist border border-line p-5">
          <p class="text-[14.5px] text-muted leading-relaxed">Not certain this is your level? The free placement assessment takes 25 minutes and settles it before you pay anything.</p>
          <a href="admission.html" class="btn btn-ghost btn-sm mt-4">Book the assessment</a>
        </div>
      </div>
      <div>
        <span class="eyebrow">What you will be able to do</span>
        <ul class="mt-6 grid gap-3.5">
          ${c.outcomes.map(o => `<li class="flex gap-3.5 items-start">
            <span class="mt-1 w-5 h-5 rounded-full bg-ember grid place-items-center shrink-0">
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2.5 6.3l2.4 2.4L9.5 4" stroke="#d96a12" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span class="text-[15.5px] leading-relaxed text-[#2c3a52]">${o}</span>
          </li>`).join("")}
        </ul>
        <div class="mt-9 pt-8 border-t border-line">
          <span class="eyebrow">Included</span>
          <div class="mt-5 flex flex-wrap gap-2">
            ${c.includes.map(i => `<span class="text-[13.5px] px-3 py-1.5 rounded-lg bg-mist border border-line text-muted">${i}</span>`).join("")}
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Modules -->
  <section class="section bg-mist">
    <div class="shell">
      <div class="flex flex-wrap items-end justify-between gap-6">
        <div>
          <span class="eyebrow">Course structure</span>
          <h2 class="h-sec mt-5 max-w-lg">${c.modules.length} modules, taught in this order</h2>
        </div>
        <a href="course-details.html?c=${c.slug}" class="btn btn-ghost btn-sm">Week-by-week breakdown</a>
      </div>
      <div class="mt-11 grid gap-4 md:grid-cols-2">
        ${c.modules.map((m, i) => `
          <div class="card-flat p-6 flex gap-5" data-reveal>
            <span class="mono text-[12px] tracking-[.14em] text-flame pt-1 shrink-0">${String(i + 1).padStart(2, "0")}</span>
            <div>
              <h3 class="text-[18px]">${m.t}</h3>
              <p class="mt-2 text-[14.5px] text-muted leading-relaxed">${m.d}</p>
            </div>
          </div>`).join("")}
      </div>
    </div>
  </section>

  <!-- Schedule -->
  <section class="section bg-white">
    <div class="shell grid gap-12 lg:grid-cols-[1fr_1.2fr] lg:gap-20">
      <div>
        <span class="eyebrow">Batches</span>
        <h2 class="h-sec mt-5">Pick the batch that fits your week</h2>
        <p class="lede mt-5">Batches open monthly. Seats are limited by the class cap, so the popular slots close early — the morning batch usually goes first.</p>
        <a href="admission.html?course=${c.slug}" class="btn btn-primary mt-8">Reserve a seat</a>
      </div>
      <div class="grid gap-3">
        ${c.schedule.map(s => `
          <div class="card-flat p-6 flex flex-wrap items-center justify-between gap-4" data-reveal>
            <div>
              <h3 class="text-[18px]">${s.batch}</h3>
              <p class="text-[14px] text-muted mt-1">${s.days}</p>
            </div>
            <span class="mono text-[14px] text-flame-deep bg-ember border border-[#ffd9b8] px-3.5 py-2 rounded-lg">${s.time}</span>
          </div>`).join("")}
        <p class="text-[13.5px] text-muted mt-2">Times are indicative and confirmed at admission. Friday timings differ for Junior batches.</p>
      </div>
    </div>
  </section>

  <!-- FAQ -->
  <section class="section bg-ink text-white">
    <div class="shell grid gap-12 lg:grid-cols-[1fr_1.3fr] lg:gap-20">
      <div>
        <span class="eyebrow on-dark">Questions</span>
        <h2 class="h-sec mt-5 text-white">What students ask before joining</h2>
        <p class="mt-5 text-white/70 text-[15.5px] leading-relaxed">Anything not covered here, the IELTS Department answers on 01901-402204.</p>
      </div>
      <div class="grid gap-3">
        ${c.faq.map(f => `
          <details class="acc rounded-xl border border-white/12 bg-white/[.04] p-5">
            <summary class="flex items-center justify-between gap-5 text-[16.5px] font-semibold text-white">
              ${f.q}
              <svg class="chev shrink-0" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3.5 6l4.5 4.5L12.5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </summary>
            <p class="mt-3.5 text-[15px] text-white/70 leading-relaxed">${f.a}</p>
          </details>`).join("")}
      </div>
    </div>
  </section>

  <!-- Related -->
  <section class="section bg-white">
    <div class="shell">
      <span class="eyebrow">Also consider</span>
      <h2 class="h-sec mt-5 max-w-lg">Other programs students pair with this one</h2>
      <div class="mt-11 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">${more.map(courseCard).join("")}</div>
    </div>
  </section>`;

  initRails(); initReveal();
});
</script>
</body>
</html>
