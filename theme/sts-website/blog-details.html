<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Article — STS Institute</title>
<meta name="description" content="IELTS and study abroad guidance from STS Institute, Narsingdi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tw-config.js"></script>
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="https://sts.institute/riltoduw/2024/08/Logo-v2-01.png">
</head>
<body>
<div id="site-header" data-mode="solid" data-active="blog"></div>
<a id="main" tabindex="-1"></a>

<!-- reading progress -->
<div class="fixed top-0 left-0 h-[3px] bg-flame z-[80] transition-[width] duration-150" id="progress" style="width:0"></div>

<main id="page"></main>
<div id="site-footer"></div>

<script src="assets/site.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const slug = new URLSearchParams(location.search).get("p") || BLOGS[0].slug;
  const b = BLOGS.find(x => x.slug === slug) || BLOGS[0];
  const more = BLOGS.filter(x => x.slug !== b.slug).slice(0, 3);
  document.title = b.title + " — STS Institute";

  document.getElementById("page").innerHTML = `
  <section class="bg-ink text-white pt-16 pb-24 md:pt-20 md:pb-28 relative overflow-hidden">
    <div class="grid-drift opacity-[.14]"></div>
    <div class="shell relative max-w-3xl">
      <nav class="text-[13px] text-white/50 flex items-center gap-2 flex-wrap">
        <a href="index.html" class="hover:text-white">Home</a><span>/</span>
        <a href="blogs.html" class="hover:text-white">Blog</a><span>/</span>
        <span class="text-white/80">${b.cat}</span>
      </nav>
      <h1 class="mt-6 text-white text-[clamp(30px,4.6vw,50px)]">${b.title}</h1>
      <div class="mt-7 flex flex-wrap items-center gap-x-5 gap-y-2 text-[14px] text-white/60">
        <span class="mono text-[11px] tracking-[.16em] uppercase text-flame-soft">${b.cat}</span>
        <span>${b.date}</span><span>·</span><span>${b.read} read</span><span>·</span><span>${b.author}</span>
      </div>
    </div>
  </section>

  <div class="shell -mt-14 relative z-10">
    ${photo(b.cat, "h-[220px] md:h-[380px] rounded-2xl border-4 border-white shadow-[var(--e3)]")}
  </div>

  <div class="shell py-14 md:py-20 grid gap-14 lg:grid-cols-[1fr_240px] lg:gap-16 items-start max-w-[1060px]">
    <article class="prose min-w-0">${b.body}</article>

    <aside class="lg:sticky lg:top-24 grid gap-4">
      <div class="rounded-2xl border border-line p-6 bg-mist">
        <p class="mono text-[10px] tracking-[.18em] uppercase text-muted">Share</p>
        <div class="mt-4 flex gap-2">
          <a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(location.href)}">Facebook</a>
          <button class="btn btn-ghost btn-sm" id="copy">Copy link</button>
        </div>
      </div>
      <div class="rounded-2xl bg-ink text-white p-6">
        <h3 class="text-[18px] text-white">Sit a real mock</h3>
        <p class="mt-2.5 text-[14.5px] text-white/70 leading-relaxed">Full LRW plus Speaking under exam conditions, with a written score report. ৳ 500.</p>
        <a href="course.html?c=ielts-mock-club" class="btn btn-primary btn-sm mt-4 w-full">Book a mock</a>
      </div>
    </aside>
  </div>

  <section class="section bg-mist">
    <div class="shell">
      <span class="eyebrow">Keep reading</span>
      <h2 class="h-sec mt-5 max-w-lg">More from the teaching team</h2>
      <div class="mt-11 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">${more.map(x => blogCard(x)).join("")}</div>
    </div>
  </section>`;

  initReveal();

  const bar = document.getElementById("progress");
  const art = document.querySelector("article.prose");
  const onScroll = () => {
    const rect = art.getBoundingClientRect();
    const total = rect.height - window.innerHeight;
    const done = Math.min(Math.max(-rect.top / (total > 0 ? total : 1), 0), 1);
    bar.style.width = (done * 100) + "%";
  };
  window.addEventListener("scroll", onScroll, { passive: true }); onScroll();

  document.getElementById("copy").addEventListener("click", e => {
    navigator.clipboard.writeText(location.href).then(() => {
      e.target.textContent = "Link copied";
      setTimeout(() => e.target.textContent = "Copy link", 1800);
    });
  });
});
</script>
</body>
</html>
