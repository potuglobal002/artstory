<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCULPTURA | Artworks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; } .color-olive { background-color: #88884d; }</style>
</head>
<body class="bg-white text-gray-900">
    <header class="sticky top-0 z-50 bg-white border-b border-gray-200 py-4">
        <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">
            <div class="text-2xl tracking-widest text-gray-800">SCULPTURA</div>
            <nav class="hidden md:flex gap-8 text-xs uppercase tracking-wider text-gray-500">
                <a href="index.html" class="hover:text-gray-900">Home</a>
                <a href="artworks.html" class="text-gray-900">Artworks</a>
                <a href="about.html" class="hover:text-gray-900">About Us</a>
                <a href="artists.html" class="hover:text-gray-900">Artists</a>
                <a href="contact.html" class="hover:text-gray-900">Contact</a>
            </nav>
            <div class="flex items-center gap-4">
                <span class="material-symbols-outlined text-gray-600 cursor-pointer">account_circle</span>
                <span class="material-symbols-outlined text-gray-600 cursor-pointer">shopping_bag</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <h1 class="text-4xl font-light mb-10">Artworks Catalog</h1>
        
        <div class="flex flex-col md:flex-row gap-8">
            <aside class="w-full md:w-1/4 space-y-8 border p-6 h-fit bg-gray-50">
                <div>
                    <h3 class="font-bold mb-4 text-sm uppercase tracking-wide">Categories</h3>
                    <label class="block text-sm text-gray-700 mb-2"><input type="checkbox" class="mr-2"> Paintings</label>
                    <label class="block text-sm text-gray-700 mb-2"><input type="checkbox" class="mr-2"> Sculptures</label>
                    <label class="block text-sm text-gray-700 mb-2"><input type="checkbox" class="mr-2"> Prints</label>
                </div>
                <div>
                    <h3 class="font-bold mb-4 text-sm uppercase tracking-wide">Style</h3>
                    <label class="block text-sm text-gray-700 mb-2"><input type="checkbox" class="mr-2"> Modern</label>
                    <label class="block text-sm text-gray-700 mb-2"><input type="checkbox" class="mr-2"> Abstract</label>
                </div>
                <div>
                    <h3 class="font-bold mb-4 text-sm uppercase tracking-wide">Price</h3>
                    <input type="range" class="w-full" min="0" max="100000">
                    <div class="text-sm text-gray-500 mt-2">$0 - $10,000</div>
                </div>
                <button class="w-full color-olive text-white py-3 mt-4 text-sm hover:opacity-90">Apply Filters</button>
            </aside>

            <div class="w-full md:w-3/4">
                <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
                    <a href="artwork-details.html" class="group">
                        <div class="bg-cover bg-center aspect-[4/5] bg-[url('https://placehold.co/300x400/aqua/ffffff?text=Art+5')] mb-4"></div>
                        <h3 class="font-semibold">"Study in Blue"</h3>
                        <p class="text-sm text-gray-500">12,000 RUB</p>
                    </a>
                    <a href="artwork-details.html" class="group">
                        <div class="bg-cover bg-center aspect-[4/5] bg-[url('https://placehold.co/300x400/orange/ffffff?text=Art+6')] mb-4"></div>
                        <h3 class="font-semibold">"Orange Grove"</h3>
                        <p class="text-sm text-gray-500">8,000 RUB</p>
                    </a>
                    <a href="artwork-details.html" class="group">
                        <div class="bg-cover bg-center aspect-[4/5] bg-[url('https://placehold.co/300x400/red/ffffff?text=Art+7')] mb-4"></div>
                        <h3 class="font-semibold">"Crimson"</h3>
                        <p class="text-sm text-gray-500">15,000 RUB</p>
                    </a>
                    <a href="artwork-details.html" class="group">
                        <div class="bg-cover bg-center aspect-[4/5] bg-[url('https://placehold.co/300x400/green/ffffff?text=Art+8')] mb-4"></div>
                        <h3 class="font-semibold">"Verdant"</h3>
                        <p class="text-sm text-gray-500">22,000 RUB</p>
                    </a>
                    <a href="artwork-details.html" class="group">
                        <div class="bg-cover bg-center aspect-[4/5] bg-[url('https://placehold.co/300x400/purple/ffffff?text=Art+9')] mb-4"></div>
                        <h3 class="font-semibold">"Amethyst"</h3>
                        <p class="text-sm text-gray-500">35,000 RUB</p>
                    </a>
                    <a href="artwork-details.html" class="group">
                        <div class="bg-cover bg-center aspect-[4/5] bg-[url('https://placehold.co/300x400/yellow/ffffff?text=Art+10')] mb-4"></div>
                        <h3 class="font-semibold">"Sunlight"</h3>
                        <p class="text-sm text-gray-500">18,000 RUB</p>
                    </a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
