<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCULPTURA | Contact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; } .color-olive { background-color: #88884d; }</style>
</head>
<body class="bg-white text-gray-900">
    <header class="sticky top-0 z-50 bg-white border-b border-gray-200 py-4">
        <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">
            <div class="text-2xl tracking-widest text-gray-800">SCULPTURA</div>
            <nav class="hidden md:flex gap-8 text-xs uppercase tracking-wider text-gray-500">
                <a href="index.html" class="hover:text-gray-900">Home</a>
                <a href="artworks.html" class="hover:text-gray-900">Artworks</a>
                <a href="about.html" class="hover:text-gray-900">About Us</a>
                <a href="artists.html" class="hover:text-gray-900">Artists</a>
                <a href="contact.html" class="text-gray-900">Contact</a>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-16">
        <h1 class="text-4xl font-light text-center mb-12">Get in Touch</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
            <div class="bg-gray-100 p-12">
                <h2 class="text-2xl font-light mb-6">Contact Information</h2>
                <div class="flex items-start gap-4 mb-6">
                    <span class="material-symbols-outlined text-olive">location_on</span>
                    <p class="text-gray-700">15 Iskusstv St., Moscow<br>Russia</p>
                </div>
                <div class="flex items-start gap-4 mb-6">
                    <span class="material-symbols-outlined text-olive">call</span>
                    <p class="text-gray-700">+7 (495) 123-45-67</p>
                </div>
                <div class="flex items-start gap-4 mb-6">
                    <span class="material-symbols-outlined text-olive">alternate_email</span>
                    <p class="text-gray-700">info@sculptura.com</p>
                </div>
                <div class="w-full h-64 bg-gray-300 mt-8 flex items-center justify-center text-gray-500">
                    <span class="material-symbols-outlined text-4xl">map</span>
                </div>
            </div>

            <div class="p-4">
                <h2 class="text-2xl font-light mb-6">Send us a message</h2>
                <form>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <label class="block text-sm text-gray-700 mb-2">Full Name</label>
                            <input type="text" class="w-full border border-gray-300 p-3 outline-none focus:border-gray-900" required>
                        </div>
                        <div>
                            <label class="block text-sm text-gray-700 mb-2">Email</label>
                            <input type="email" class="w-full border border-gray-300 p-3 outline-none focus:border-gray-900" required>
                        </div>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm text-gray-700 mb-2">Subject</label>
                        <input type="text" class="w-full border border-gray-300 p-3 outline-none focus:border-gray-900" required>
                    </div>
                    <div class="mb-8">
                        <label class="block text-sm text-gray-700 mb-2">Message</label>
                        <textarea class="w-full border border-gray-300 p-3 h-32 outline-none focus:border-gray-900" required></textarea>
                    </div>
                    <button type="submit" class="color-olive text-white text-sm px-8 py-3 hover:opacity-90 w-full">Submit Message</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
